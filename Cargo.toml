[package]
name = "nautilus-ovpn"
version = "0.1.3"
edition = "2021"

[workspace]
members = [".", "crates/nautilus-sys", "crates/openvpn-profile-merge"]
resolver = "2"

[lib]
crate-type = ["cdylib"]

[dependencies]
glib = "0.20"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gio = "0.20"
glib-sys = "0.20"
gobject-sys = "0.20"
gio-sys = "0.20"
gtk = { package = "gtk4", version = "0.9" }
libc = "0.2"
base64 = "0.22"
oo7 = { version = "0.4", default-features = false, features = [
    "native_crypto",
    "tokio",
] }
rhai = "1"
futures-util = "0.3"
zbus = { version = "4", features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
nautilus-sys = { path = "crates/nautilus-sys", version = "0.1.0" }
