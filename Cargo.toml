[package]
name = "nautilus-ovpn"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
glib = "0.20"
gio = "0.20"
glib-sys = "0.20"
gobject-sys = "0.20"
gio-sys = "0.20"
libc = "0.2"
zbus = { version = "4", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
bindgen = "0.71"
system-deps = "7"

[package.metadata.system-deps]
"libnautilus-extension-4" = "43"