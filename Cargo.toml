[package]
name = "nautilus-ovpn"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
glib = "0.20"
gio = "0.20"
zbus = { version = "4", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
system-deps = "7"